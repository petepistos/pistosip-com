<!doctype html>

<head>
<meta charset="utf-8">

<title>Quantum Cryptography | Pistos Documentary</title>
<style>
:root{--bg:#02070d;--panel:#071623;--cyan:#17d8ff;--green:#55ff82;--red:#ff354d;--text:#edfaff;--muted:#9bb7c3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}body{padding:12px}.app{width:min(1500px,100%);margin:auto}.header{text-align:center;padding:12px 8px 18px}.brand{font-weight:800;letter-spacing:.18em;color:var(--cyan);font-size:13px}.header h1{margin:7px 0 3px;font-size:clamp(28px,4.2vw,62px)}.header p{margin:0;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;min-height:560px}.panel{position:relative;display:flex;flex-direction:column;border:1px solid #164a66;border-radius:14px;background:linear-gradient(180deg,rgba(9,32,48,.98),rgba(3,13,22,.98));padding:14px 12px 13px;cursor:pointer;color:inherit;text-align:left;overflow:hidden;transition:.2s ease}.panel:hover,.panel:focus-visible{border-color:var(--cyan);transform:translateY(-2px);outline:none}.panel.active{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,53,77,.35),0 0 24px rgba(255,53,77,.45);animation:pulse 1.1s infinite}.panel.done{border-color:#2ca55b}.num{font-size:42px;font-weight:900;color:var(--cyan);line-height:1}.panel h2{font-size:clamp(15px,1.25vw,20px);margin:7px 0 8px}.visual{height:180px;margin:5px 0 10px;border-radius:12px;background:radial-gradient(circle at 50% 42%,rgba(23,216,255,.35),rgba(23,216,255,.06) 36%,transparent 62%),linear-gradient(135deg,#06131f,#0a2031);display:grid;place-items:center;position:relative;overflow:hidden}.visual:before,.visual:after{content:"";position:absolute;border:2px solid rgba(23,216,255,.55);border-radius:50%;width:90px;height:90px;animation:spin 8s linear infinite}.visual:after{width:130px;height:48px;transform:rotate(35deg);animation-duration:5s}.symbol{font-size:42px;font-weight:900;color:#fff;text-shadow:0 0 18px var(--cyan);z-index:1}.bullets{margin:0;padding-left:18px;color:#cfe9f2;font-size:13px;line-height:1.45}.takeaway{margin-top:auto;padding-top:10px;border-top:1px solid #17425a;color:var(--green);font-size:12px;font-weight:700}.controls{margin-top:12px;border:1px solid #14698d;border-radius:12px;background:#04131e;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.stop{border:1px solid var(--red);background:#3a0711;color:#fff;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer}.chapter{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{font:700 16px Consolas,monospace;min-width:54px;text-align:right}.ticker{margin-top:10px;min-height:92px;border:1px solid #0f87b3;border-radius:12px;background:#020d14;padding:12px 15px;color:#72ff46;font:14px/1.48 Consolas,monospace;overflow:hidden}.status{margin-top:7px;color:var(--muted);font-size:11px;text-align:right}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,53,77,.18),0 0 36px rgba(255,53,77,.68)}}
@media(max-width:1050px){.panels{grid-template-columns:repeat(3,1fr)}.visual{height:135px}}@media(max-width:620px){body{padding:7px}.panels{grid-template-columns:1fr}.panel{min-height:330px}.controls{grid-template-columns:auto 1fr}.timer{grid-column:2}.ticker{font-size:12px}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="brand">PISTOS DOCUMENTARY</div><h1>How Quantum Cryptography Works</h1><p>Six chapters. About two minutes each. Select any chapter to begin.</p></header>
<section class="panels" aria-label="Documentary chapters">
<button class="panel" data-i="0"><span class="num">01</span><h2>The Quantum Threat</h2><div class="visual"><span class="symbol">RSA</span></div><ul class="bullets"><li>Classical public-key encryption</li><li>Shor's algorithm</li><li>Harvest-now, decrypt-later</li></ul><div class="takeaway">Quantum computers change the lifespan of today's secrets.</div></button>
<button class="panel" data-i="1"><span class="num">02</span><h2>Qubits and Measurement</h2><div class="visual"><span class="symbol">|ψ⟩</span></div><ul class="bullets"><li>Superposition</li><li>Measurement changes state</li><li>No-cloning principle</li></ul><div class="takeaway">Quantum information cannot be observed invisibly.</div></button>
<button class="panel" data-i="2"><span class="num">03</span><h2>BB84 Key Exchange</h2><div class="visual"><span class="symbol">BB84</span></div><ul class="bullets"><li>Alice sends photons</li><li>Bob measures bases</li><li>Matching results form a key</li></ul><div class="takeaway">The key is built from measurements, not transported intact.</div></button>
<button class="panel" data-i="3"><span class="num">04</span><h2>Catching Eve</h2><div class="visual"><span class="symbol">EVE</span></div><ul class="bullets"><li>Interception disturbs photons</li><li>Error rates expose interference</li><li>Compromised keys are discarded</li></ul><div class="takeaway">Eavesdropping leaves evidence in the quantum channel.</div></button>
<button class="panel" data-i="4"><span class="num">05</span><h2>Real-World QKD</h2><div class="visual"><span class="symbol">QKD</span></div><ul class="bullets"><li>Fiber links</li><li>Trusted nodes</li><li>Satellite distribution</li></ul><div class="takeaway">QKD protects selected high-value links, not every system.</div></button>
<button class="panel" data-i="5"><span class="num">06</span><h2>The Quantum-Safe Future</h2><div class="visual"><span class="symbol">PQC</span></div><ul class="bullets"><li>Post-quantum algorithms</li><li>Cryptographic inventory</li><li>Crypto-agility</li></ul><div class="takeaway">Preparation matters more than predicting the arrival date.</div></button>
</section>
<section class="controls"><button id="stop" class="stop" type="button">Stop</button><div id="chapter" class="chapter">Select a chapter</div><div id="timer" class="timer">00:00</div></section>
<section id="ticker" class="ticker" aria-live="polite">Select a chapter to begin the documentary.</section>
<div id="status" class="status">MP3 narration is used when available; browser narration is the automatic fallback.</div>
</main>
<script>
const chapters=[
{title:'The Quantum Threat',text:`Most secure internet traffic depends on mathematical problems that ordinary computers cannot solve quickly. RSA relies on the difficulty of factoring very large numbers, while elliptic-curve cryptography relies on a different hard problem. Quantum computing changes that assumption. A sufficiently capable quantum computer running Shor's algorithm could solve both types of problems far faster than today's machines. That does not mean every encrypted message is suddenly readable today. It means information stolen and stored now could be decrypted later, once the necessary quantum hardware exists. This is called harvest now, decrypt later. The danger is greatest for data that must remain confidential for many years: health records, financial information, government communications, intellectual property, and long-term business strategy. Quantum cryptography approaches the problem differently. Instead of relying only on a difficult equation, it uses measurable properties of quantum physics to help create and exchange encryption keys. The crucial distinction is that quantum cryptography does not magically encrypt every file. Its best-known use is quantum key distribution, or QKD, which helps two parties establish shared key material while revealing whether someone interfered with the exchange.`},
{title:'Qubits and Measurement',text:`A classical bit is either zero or one. A qubit can be prepared in a combination of both possibilities called superposition. That does not mean it is simply hiding a normal zero or one. It means the system is described by probabilities until it is measured. Measurement produces a definite result and changes the state. This behavior is central to quantum key distribution because an eavesdropper cannot inspect an unknown quantum state without risking a detectable disturbance. Another important rule is the no-cloning theorem. An unknown quantum state cannot be copied perfectly. Ordinary network equipment can duplicate a digital signal and pass the copy along. Quantum information does not allow that same invisible copy operation. These rules give quantum communication its unusual security properties. They do not make every device perfect. Sources, detectors, software, timing systems, and operators can still fail. The physics protects the quantum state, while engineering and governance must protect the complete system. Quantum security is therefore not an escape from normal cybersecurity. It is a new layer that creates evidence when the communication channel is observed.`},
{title:'BB84 Key Exchange',text:`BB84 is the best-known quantum key distribution protocol. Alice prepares a sequence of photons using randomly selected polarization bases. Each photon represents a possible key value. Bob measures every photon, also choosing his measurement basis at random. Later, Alice and Bob communicate over a normal authenticated channel and compare only which bases they used. They do not reveal the secret results themselves. Whenever their bases match, Bob's measurement should agree with Alice's preparation. Results from mismatched bases are discarded. The remaining results become a sifted key. Alice and Bob then test a small sample to estimate the error rate, correct ordinary transmission errors, and apply privacy amplification to reduce any information an attacker might have gained. The result is shared secret key material that can be used by conventional symmetric encryption. The photons do not carry a finished password from one side to the other. The key emerges from preparation, measurement, comparison, and filtering. That is why interception creates a problem for the attacker: choosing the wrong measurement basis changes the statistics Alice and Bob expect to see.`},
{title:'Catching Eve',text:`Suppose Eve intercepts Alice's photons, measures them, and sends replacements to Bob. Eve does not know which basis Alice used, so she must guess. Some guesses are correct, but others are wrong. A wrong measurement disturbs the state. When Bob later measures the replacement, the disagreement rate rises. Alice and Bob reveal a small sample of their results and calculate the quantum bit error rate. A normal link has some background errors because equipment and transmission channels are imperfect. If the error rate exceeds the accepted threshold, they assume the key may be compromised and discard it. This is the core promise of quantum key distribution: observation can become detectable. Real attackers may target implementation weaknesses rather than ideal quantum theory. Detector blinding, timing manipulation, source flaws, insecure management software, or poorly protected trusted nodes can undermine a deployment. Modern systems therefore need monitoring, hardened components, authenticated classical channels, secure key storage, and disciplined operations. The laws of physics help, but they do not patch the server rack or train the administrator.`},
{title:'Real-World QKD',text:`Quantum key distribution is already used on selected links in government, finance, research, and critical infrastructure. The challenge is distance and operational complexity. Photons traveling through fiber are absorbed and scattered. Unknown quantum states cannot simply be copied and amplified by ordinary repeaters. Trusted relay nodes can extend a network, but every relay must be physically and operationally secure because it handles key material. Satellite QKD can cover much greater distances because photons experience less loss through space than through thousands of miles of fiber. Researchers are also developing quantum repeaters that may eventually connect long-distance quantum networks without trusting every intermediate location. For now, organizations must evaluate cost, distance, hardware, maintenance, key-management integration, and the value of the data being protected. QKD does not prevent phishing, ransomware, weak passwords, or accidental disclosure. It addresses a narrower problem: establishing encryption keys while detecting interference with the quantum channel. That makes it most attractive for exceptionally valuable communications with long confidentiality requirements.`},
{title:'The Quantum-Safe Future',text:`Most organizations will use a combination of post-quantum cryptography and, in limited cases, quantum key distribution. Post-quantum cryptography uses new mathematical algorithms designed to resist both conventional and quantum attacks. It runs on ordinary computers and can be deployed through software, protocols, certificates, hardware security modules, and network products. Migration still requires planning. New algorithms can have larger keys, larger signatures, different memory needs, and different performance characteristics. The starting point is a cryptographic inventory. Identify where RSA, elliptic-curve cryptography, digital signatures, certificates, and long-lived encrypted data are used. Prioritize systems that are difficult to replace and data that must remain confidential for many years. Ask vendors for migration plans, test hybrid configurations, and build crypto-agility so algorithms can be replaced without rebuilding entire systems. Nobody can name the exact day a cryptographically relevant quantum computer will arrive. The goal is not to predict a date. The goal is to avoid discovering, too late, that critical systems cannot be upgraded.`}
];
const panels=[...document.querySelectorAll('.panel')],ticker=document.getElementById('ticker'),timer=document.getElementById('timer'),chapter=document.getElementById('chapter'),status=document.getElementById('status');
const audio=new Audio();audio.preload='metadata';let active=-1,raf=0,start=0,elapsed=0,speech=null,words=[],wordIndex=0,wordTimer=0;
function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderTicker(){const visible=words.slice(Math.max(0,wordIndex-30),wordIndex+1).join(' ');ticker.textContent=visible||'Loading narration...'}
function stop(){audio.pause();audio.removeAttribute('src');audio.load();speechSynthesis.cancel();cancelAnimationFrame(raf);clearInterval(wordTimer);start=0;elapsed=0;active=-1;timer.textContent='00:00';panels.forEach(p=>p.classList.remove('active'));chapter.textContent='Stopped';ticker.textContent='Narration stopped. Select a chapter to begin again.'}
function clock(){let t=elapsed;if(!audio.paused&&Number.isFinite(audio.currentTime))t=audio.currentTime;else if(start)t=(performance.now()-start)/1000;timer.textContent=fmt(t);raf=requestAnimationFrame(clock)}
function beginTicker(text,duration=120){words=text.split(/\s+/);wordIndex=0;renderTicker();clearInterval(wordTimer);wordTimer=setInterval(()=>{if(wordIndex<words.length-1){wordIndex++;renderTicker()}else clearInterval(wordTimer)},Math.max(90,duration*1000/words.length))}
function fallback(i){status.textContent='MP3 not found. Using browser narration fallback.';speech=new SpeechSynthesisUtterance(chapters[i].text);speech.rate=.93;speech.pitch=1;speech.onstart=()=>{start=performance.now();clock();beginTicker(chapters[i].text,120)};speech.onend=()=>{panels[i].classList.remove('active');panels[i].classList.add('done');timer.textContent='02:00';ticker.textContent=chapters[i].text};speechSynthesis.speak(speech)}
function play(i){stop();active=i;panels[i].classList.add('active');chapter.textContent=`Chapter ${i+1} of 6 — ${chapters[i].title}`;ticker.textContent='Loading narration...';status.textContent='Loading MP3 narration...';audio.src=`audio/chapter${i+1}.mp3`;audio.onloadedmetadata=()=>{status.textContent='Playing MP3 narration.';beginTicker(chapters[i].text,audio.duration||120)};audio.onplay=()=>{start=performance.now();clock()};audio.ontimeupdate=()=>{elapsed=audio.currentTime};audio.onended=()=>{cancelAnimationFrame(raf);clearInterval(wordTimer);panels[i].classList.remove('active');panels[i].classList.add('done');timer.textContent=fmt(audio.duration);ticker.textContent=chapters[i].text};audio.onerror=()=>fallback(i);audio.play().catch(()=>fallback(i))}
panels.forEach((p,i)=>p.addEventListener('click',()=>play(i)));document.getElementById('stop').addEventListener('click',stop);window.addEventListener('beforeunload',stop);window.addEventListener('keydown',e=>{if(e.key==='Escape')stop()});
</script>
</body>
</html>
